  :root {
    --ink: #121110;
    --ink-raised: #1b1917;
    --tag: #efe2c4;
    --tag-dim: #e2d3ac;
    --tag-line: #cbb98a;
    --orange: #ff4d1c;
    --orange-ink: #b23411;
    --cobalt: #1c3aff;
    --cobalt-ink: #14297d;
    --ink-soft: #6b5f45;
    --ink-faint: rgba(239, 226, 196, 0.4);
    --paper-text: #1c1712;
    --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-mono: 'Space Mono', 'Courier New', monospace;
    --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  }

  html { background: var(--ink); }

  body {
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255, 77, 28, 0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(28, 58, 255, 0.12), transparent 45%);
    color: var(--tag);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  #root {
    min-height: 100vh;
    min-height: 100dvh;
  }

  button { font-family: inherit; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom)) 18px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  .brand {
    font-family: var(--font-display);
    font-size: 2rem;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--tag);
    margin: 0;
  }

  .brand span {
    color: var(--orange);
  }

  .badge {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: var(--tag);
    padding: 6px 10px;
    border-radius: 3px;
    transform: rotate(-2deg);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .undo-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 3px;
    border: 2px solid var(--ink-faint);
    background: transparent;
    color: var(--tag);
    cursor: pointer;
    flex: 0 0 auto;
    -webkit-tap-highlight-color: transparent;
  }

  .undo-btn:disabled { opacity: 0.25; cursor: default; }
  .undo-btn svg { width: 17px; height: 17px; }

  .progress-track {
    height: 5px;
    background: var(--ink-raised);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), var(--cobalt));
    border-radius: 3px;
    transition: width 320ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ---------- deck ---------- */

  .deck {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 420px;
    padding: 6px 0 18px 0;
  }

  .deck-stack {
    position: relative;
    width: 100%;
    max-width: 340px;
    aspect-ratio: 3 / 4;
  }

  .stack-card {
    position: absolute;
    inset: 0;
    background: var(--tag-dim);
    border: 3px solid var(--paper-text);
    border-radius: 14px;
  }

  .stack-card.s1 { transform: rotate(-4deg) translateY(6px); z-index: 1; }
  .stack-card.s2 { transform: rotate(5deg) translateY(12px); z-index: 0; background: var(--tag-dim); opacity: 0.7; }

  .card {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: var(--tag);
    border: 3px solid var(--paper-text);
    border-radius: 14px;
    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    padding: 22px;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
    color: var(--paper-text);
  }

  .card:active { cursor: grabbing; }

  .card.dragging { transition: none; }
  .card.snap-back { transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .card.fly-left { transition: transform 340ms ease-in, opacity 340ms ease-in; }
  .card.fly-right { transition: transform 340ms ease-in, opacity 340ms ease-in; }

  .card-eyebrow {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }

  .card-punch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--ink-soft);
    background: var(--ink);
  }

  .card-body {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }

  .card-title {
    font-family: var(--font-display);
    font-size: 3.4rem;
    line-height: 0.92;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-wrap: balance;
    margin: 0;
  }

  .card-question {
    font-family: var(--font-body);
    font-size: 1.08rem;
    font-weight: 400;
    line-height: 1.45;
    color: var(--paper-text);
    max-width: 30ch;
  }

  .card-footer {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .stamp {
    position: absolute;
    top: 26px;
    font-family: var(--font-display);
    font-size: 1.7rem;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    border: 4px solid currentColor;
    border-radius: 8px;
    text-transform: uppercase;
    pointer-events: none;
  }

  .stamp.yes {
    right: 18px;
    color: var(--cobalt);
    transform: rotate(12deg);
  }

  .stamp.no {
    left: 18px;
    color: var(--orange);
    transform: rotate(-12deg);
  }

  /* ---------- action row ---------- */

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }

  .action-btn {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 16px 12px;
    border-radius: 10px;
    font-family: var(--font-display);
    font-size: 1.15rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    border: 3px solid var(--paper-text);
    -webkit-tap-highlight-color: transparent;
    transition: transform 120ms ease;
  }

  .action-btn:active { transform: scale(0.96); }

  .action-btn svg { width: 18px; height: 18px; flex: 0 0 auto; }

  .action-btn.skip {
    background: var(--ink);
    color: var(--orange);
    border-color: var(--orange);
  }

  .action-btn.did {
    background: var(--cobalt);
    color: var(--tag);
    border-color: var(--paper-text);
  }

  .hint {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin-top: 14px;
    text-transform: uppercase;
  }

  /* ---------- summary / manifest screen ---------- */

  .manifest {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }

  .manifest-headline {
    font-family: var(--font-display);
    font-size: 3.1rem;
    line-height: 0.95;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-wrap: balance;
    color: var(--tag);
    margin: 8px 0 6px 0;
  }

  .manifest-headline em {
    font-style: normal;
    color: var(--orange);
  }

  .manifest-sub {
    font-family: var(--font-body);
    font-size: 0.98rem;
    color: var(--ink-faint);
    max-width: 32ch;
    margin: 0 0 26px 0;
    line-height: 1.5;
  }

  .manifest-count {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: var(--tag);
    border-radius: 3px;
    padding: 5px 10px;
    align-self: flex-start;
    margin-bottom: 22px;
    font-variant-numeric: tabular-nums;
  }

  .manifest-count b {
    font-family: var(--font-display);
    font-size: 1.05rem;
    color: var(--paper-text);
  }

  .chip-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    margin-bottom: 24px;
  }

  .chip {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 12px;
    border-radius: 8px;
    border: 2px solid var(--ink-faint);
    background: var(--ink-raised);
    color: var(--tag);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.86rem;
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    transition: background 160ms ease, border-color 160ms ease;
  }

  .chip.on {
    background: var(--tag);
    border-color: var(--paper-text);
    color: var(--paper-text);
  }

  .chip-mark {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chip.on .chip-mark {
    background: var(--cobalt);
    border-color: var(--paper-text);
  }

  .chip-mark svg {
    width: 10px;
    height: 10px;
    opacity: 0;
  }

  .chip.on .chip-mark svg { opacity: 1; }

  .manifest-footer {
    margin-top: auto;
    display: flex;
    justify-content: center;
  }

  .redo-btn {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 10px;
  }

  @media (min-width: 520px) {
    .card-title { font-size: 3.8rem; }
    .manifest-headline { font-size: 3.6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill, .action-btn { transition-duration: 1ms !important; }
  }
</style>

})();
</script>


<script>
const { useState, useEffect, useCallback, useRef, createElement: h } = React;

const ITEMS = [
  { id: "sleep", label: "Sleep", description: "Did you rest enough to feel human today?" },
  { id: "exercise", label: "Exercise", description: "Did you move your body, even a little?" },
  { id: "whole-foods", label: "Whole Foods", description: "Did you eat something real, not just fuel?" },
  { id: "duty", label: "Duty", description: "Did you do the thing you were responsible for?" },
  { id: "authenticity", label: "Authenticity", description: "Were you honest about who you actually are?" },
  { id: "purpose", label: "Purpose", description: "Did you do something that felt like it mattered?" },
  { id: "socialise", label: "Socialise", description: "Did you connect with people beyond passing by?" },
  { id: "relationship", label: "Relationship", description: "Did you tend to someone you love?" },
  { id: "rest", label: "Rest", description: "Did you let yourself stop, without guilt?" },
  { id: "play", label: "Play", description: "Did you do something just for the joy of it?" },
  { id: "values", label: "Values", description: "Did you act in line with what you believe?" },
  { id: "integrity", label: "Integrity", description: "Did your actions match your words?" },
  { id: "gratitude", label: "Gratitude", description: "Did you notice something to be thankful for?" },
  { id: "enough", label: "Enough", description: "Did you feel like what you have, and are, is enough?" },
  { id: "serve", label: "Serve", description: "Did you help someone without keeping score?" },
  { id: "money", label: "Money", description: "Did you handle it wisely, without letting it rule you?" },
  { id: "moderation", label: "Moderation", description: "Did you keep the good things in balance?" },
  { id: "spirituality", label: "Spirituality", description: "Did you connect to something larger than yourself?" },
];

const STORAGE_KEY = "enough:log";
const SWIPE_THRESHOLD = 110;

function todayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function formatDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric",
  });
}

function loadLog() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveLog(log) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
  } catch (e) {
    // storage unavailable; state still lives in memory for this session
  }
}

function readoutFor(count) {
  if (count === 0) {
    return {
      word: "QUIET",
      rest: "DAY",
      sub: "That's okay. Some days are quiet, and that's not a failure.",
    };
  }
  if (count <= 4) {
    return {
      word: "SOFT",
      rest: "DAY",
      sub: "A few things went in. That counts for something.",
    };
  }
  if (count <= 9) {
    return {
      word: "GENTLE",
      rest: "DAY",
      sub: "A solid spread today. No need to chase the rest.",
    };
  }
  if (count <= 13) {
    return {
      word: "FULL",
      rest: "DAY",
      sub: "A lot went in today. Balance, not perfection.",
    };
  }
  return {
    word: "VERY FULL",
    rest: "DAY",
    sub: "Enough doesn't mean everything. Balance matters more than the count.",
  };
}

function CheckGlyph() {
  return h(
    "svg",
    { viewBox: "0 0 16 16", fill: "none" },
    h("path", {
      d: "M3 8.5L6.2 11.7L13 4.5",
      stroke: "currentColor",
      strokeWidth: "2.4",
      strokeLinecap: "round",
      strokeLinejoin: "round",
    })
  );
}

function UndoGlyph() {
  return h(
    "svg",
    { viewBox: "0 0 20 20", fill: "none" },
    h("path", {
      d: "M6 5L2.5 8.5L6 12",
      stroke: "currentColor",
      strokeWidth: "1.8",
      strokeLinecap: "round",
      strokeLinejoin: "round",
    }),
    h("path", {
      d: "M2.5 8.5H12.5C15 8.5 17 10.5 17 13C17 15.5 15 17.5 12.5 17.5H9",
      stroke: "currentColor",
      strokeWidth: "1.8",
      strokeLinecap: "round",
      strokeLinejoin: "round",
    })
  );
}

function XGlyph() {
  return h(
    "svg",
    { viewBox: "0 0 16 16", fill: "none" },
    h("path", {
      d: "M3 3L13 13M13 3L3 13",
      stroke: "currentColor",
      strokeWidth: "2.4",
      strokeLinecap: "round",
    })
  );
}

function CheckThick() {
  return h(
    "svg",
    { viewBox: "0 0 16 16", fill: "none" },
    h("path", {
      d: "M2.5 8.5L6.2 12.2L13.5 3.5",
      stroke: "currentColor",
      strokeWidth: "2.6",
      strokeLinecap: "round",
      strokeLinejoin: "round",
    })
  );
}

function Card({ item, index, total, dragX, isDragging, exitDir, handlers }) {
  let tx = dragX;
  if (exitDir === "left") tx = -640;
  if (exitDir === "right") tx = 640;
  const rotation = tx / 22;

  const cardClass =
    "card" +
    (isDragging ? " dragging" : exitDir ? " fly-" + exitDir : " snap-back");

  const yesOpacity = exitDir === "right" ? 1 : Math.min(Math.max(dragX, 0) / SWIPE_THRESHOLD, 1);
  const noOpacity = exitDir === "left" ? 1 : Math.min(Math.max(-dragX, 0) / SWIPE_THRESHOLD, 1);

  return h(
    "div",
    {
      className: cardClass,
      style: {
        transform: `translateX(${tx}px) rotate(${rotation}deg)`,
        opacity: exitDir ? 0 : 1,
      },
      onPointerDown: handlers.onPointerDown,
      onPointerMove: handlers.onPointerMove,
      onPointerUp: handlers.onPointerUp,
      onPointerCancel: handlers.onPointerUp,
    },
    h(
      "div",
      { className: "card-eyebrow" },
      h("span", null, `ITEM ${String(index + 1).padStart(2, "0")}/${total}`),
      h("span", { className: "card-punch" })
    ),
    h(
      "div",
      { className: "card-body" },
      h("h2", { className: "card-title" }, item.label),
      h("p", { className: "card-question" }, item.description)
    ),
    h("div", { className: "card-footer" }, "NO STREAKS. NO SCORE."),
    h(
      "div",
      { className: "stamp no", style: { opacity: noOpacity } },
      "SKIP"
    ),
    h(
      "div",
      { className: "stamp yes", style: { opacity: yesOpacity } },
      "DID IT"
    )
  );
}

function Manifest({ items, doneSet, count, total, onToggle, onRedo }) {
  const { word, rest, sub } = readoutFor(count);
  return h(
    "div",
    { className: "manifest" },
    h(
      "div",
      { className: "manifest-count" },
      h("b", null, count),
      ` / ${total} MARKED DONE`
    ),
    h(
      "h1",
      { className: "manifest-headline" },
      "A ",
      h("em", null, word),
      " ",
      rest
    ),
    h("p", { className: "manifest-sub" }, sub),
    h(
      "div",
      { className: "chip-grid" },
      items.map((item) =>
        h(
          "button",
          {
            key: item.id,
            type: "button",
            className: "chip" + (doneSet.has(item.id) ? " on" : ""),
            onClick: () => onToggle(item.id),
            "aria-pressed": doneSet.has(item.id),
          },
          h("span", { className: "chip-mark" }, h(CheckThick)),
          item.label
        )
      )
    ),
    h(
      "div",
      { className: "manifest-footer" },
      h(
        "button",
        { type: "button", className: "redo-btn", onClick: onRedo },
        "Start today over"
      )
    )
  );
}

function App() {
  const [dateKey, setDateKey] = useState(todayKey());
  const [log, setLog] = useState(loadLog);

  const [dragX, setDragX] = useState(0);
  const [isDragging, setIsDragging] = useState(false);
  const [exitDir, setExitDir] = useState(null);
  const startXRef = useRef(0);

  useEffect(() => {
    const interval = setInterval(() => {
      const current = todayKey();
      setDateKey((prev) => (prev === current ? prev : current));
    }, 30000);
    return () => clearInterval(interval);
  }, []);

  const day = log[dateKey] || { done: [], reviewed: [] };
  const reviewedSet = new Set(day.reviewed);
  const doneSet = new Set(day.done);
  const remaining = ITEMS.filter((i) => !reviewedSet.has(i.id));
  const isComplete = remaining.length === 0;
  const currentItem = remaining[0];

  const commitSwipe = useCallback(
    (id, didIt) => {
      setLog((prev) => {
        const d = prev[dateKey] || { done: [], reviewed: [] };
        const reviewed = [...d.reviewed, id];
        const done = didIt ? [...d.done, id] : d.done;
        const updated = { ...prev, [dateKey]: { done, reviewed } };
        saveLog(updated);
        return updated;
      });
    },
    [dateKey]
  );

  const triggerExit = useCallback(
    (dir) => {
      if (exitDir || !currentItem) return;
      setIsDragging(false);
      setExitDir(dir);
      setTimeout(() => {
        commitSwipe(currentItem.id, dir === "right");
        setDragX(0);
        setExitDir(null);
      }, 300);
    },
    [exitDir, currentItem, commitSwipe]
  );

  const onPointerDown = (e) => {
    if (exitDir) return;
    startXRef.current = e.clientX;
    setIsDragging(true);
    e.currentTarget.setPointerCapture(e.pointerId);
  };

  const onPointerMove = (e) => {
    if (!isDragging) return;
    setDragX(e.clientX - startXRef.current);
  };

  const onPointerUp = () => {
    if (!isDragging) return;
    setIsDragging(false);
    if (dragX > SWIPE_THRESHOLD) {
      triggerExit("right");
    } else if (dragX < -SWIPE_THRESHOLD) {
      triggerExit("left");
    } else {
      setDragX(0);
    }
  };

  const undo = useCallback(() => {
    setLog((prev) => {
      const d = prev[dateKey];
      if (!d || d.reviewed.length === 0) return prev;
      const lastId = d.reviewed[d.reviewed.length - 1];
      const reviewed = d.reviewed.slice(0, -1);
      const done = d.done.filter((x) => x !== lastId);
      const updated = { ...prev, [dateKey]: { done, reviewed } };
      saveLog(updated);
      return updated;
    });
  }, [dateKey]);

  const toggleChip = useCallback(
    (id) => {
      setLog((prev) => {
        const d = prev[dateKey] || { done: [], reviewed: [] };
        const done = d.done.includes(id)
          ? d.done.filter((x) => x !== id)
          : [...d.done, id];
        const updated = { ...prev, [dateKey]: { ...d, done } };
        saveLog(updated);
        return updated;
      });
    },
    [dateKey]
  );

  const redoToday = useCallback(() => {
    setLog((prev) => {
      const updated = { ...prev, [dateKey]: { done: [], reviewed: [] } };
      saveLog(updated);
      return updated;
    });
  }, [dateKey]);

  return h(
    "div",
    { className: "app" },
    h(
      "div",
      { className: "topbar" },
      h("h1", { className: "brand" }, "EN", h("span", null, "OUGH")),
      isComplete
        ? h("div", { className: "badge" }, formatDate(dateKey))
        : h(
            "div",
            { style: { display: "flex", alignItems: "center", gap: "10px" } },
            h(
              "div",
              { className: "badge" },
              `${reviewedSet.size + 1} / ${ITEMS.length}`
            ),
            h(
              "button",
              {
                type: "button",
                className: "undo-btn",
                onClick: undo,
                disabled: reviewedSet.size === 0,
                "aria-label": "Undo last",
              },
              h(UndoGlyph)
            )
          )
    ),
    h(
      "div",
      { className: "progress-track" },
      h("div", {
        className: "progress-fill",
        style: { width: `${(reviewedSet.size / ITEMS.length) * 100}%` },
      })
    ),
    isComplete
      ? h(Manifest, {
          items: ITEMS,
          doneSet,
          count: doneSet.size,
          total: ITEMS.length,
          onToggle: toggleChip,
          onRedo: redoToday,
        })
      : h(
          "div",
          { className: "deck" },
          h(
            "div",
            { className: "deck-stack" },
            h("div", { className: "stack-card s2" }),
            h("div", { className: "stack-card s1" }),
            h(Card, {
              key: currentItem.id,
              item: currentItem,
              index: reviewedSet.size,
              total: ITEMS.length,
              dragX,
              isDragging,
              exitDir,
              handlers: { onPointerDown, onPointerMove, onPointerUp },
            })
          )
        ),
    !isComplete &&
      h(
        "div",
        { className: "actions" },
        h(
          "button",
          {
            type: "button",
            className: "action-btn skip",
            onClick: () => triggerExit("left"),
          },
          h(XGlyph),
          "Skip"
        ),
        h(
          "button",
          {
            type: "button",
            className: "action-btn did",
            onClick: () => triggerExit("right"),
          },
          h(CheckGlyph),
          "Did it"
        )
      ),
    !isComplete &&
      h(
        "div",
        { className: "hint" },
        "Drag the card, or tap a button below"
      )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));
</script>
</body>
</html>
