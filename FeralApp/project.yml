name: Feral
options:
  bundleIdPrefix: com.feral.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Feral:
    type: application
    platform: iOS
    sources:
      - path: Feral
    info:
      path: Feral/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: "Feral uses motion to notice when you set your phone face-down, so it can offer to start a session hands-free."
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feral.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  FeralTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FeralTests
    dependencies:
      - target: Feral
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feral.app.tests

schemes:
  Feral:
    build:
      targets:
        Feral: all
    test:
      targets:
        - FeralTests
    run:
      config: Debug
