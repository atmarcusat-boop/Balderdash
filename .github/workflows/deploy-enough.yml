name: Deploy Enough to GitHub Pages

on:
  push:
    branches:
      - claude/enough-wellbeing-prototype-nsdn3l
      - main
    paths:
      - 'enough/**'
      - '.github/workflows/deploy-enough.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: enough/package-lock.json

      - name: Install dependencies
        working-directory: enough
        run: npm ci

      - name: Build
        working-directory: enough
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBnG-_tN0ObrXyn6dd_yWhXmBl2LBQkwBg
          VITE_FIREBASE_AUTH_DOMAIN: enough-app-77e07.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: enough-app-77e07
          VITE_FIREBASE_STORAGE_BUCKET: enough-app-77e07.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '309102506740'
          VITE_FIREBASE_APP_ID: 1:309102506740:web:c566e9dfcfa8c6add524a1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: enough/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
